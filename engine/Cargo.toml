[workspace]
resolver = "2"
members = ["core", "io", "ops", "render", "text", "ffi"]
default-members = ["core", "ffi"]

[workspace.package]
version = "0.9.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
wgpu = { version = "30.0", default-features = false }
naga = { version = "30.0", default-features = false }
bytemuck = { version = "1.25", default-features = false }
thiserror = "2.0"
anyhow = "1.0"
pollster = "0.4.0"
uuid = { version = "1.24.0", default-features = false }
rusqlite = "0.40.2"
dirs = "5.0"
proptest = "1.11"
tempfile = "3.27.0"
rayon = "1.12"
parking_lot = "0.12.5"
num_enum = "0.7"
png = "0.17"
flate2 = "1.1"
rustc-hash = "2.1"
zstd = "0.13"
cosmic-text = "0.19.0"

[profile.dev]
# Line tables (for backtraces/panics) without full variable/type DWARF info: dev builds spend
# a lot of their codegen+link time emitting debug info that never gets used interactively.
# On macOS this also matters because `split-debuginfo = "unpacked"` skips the `dsymutil` pass
# that otherwise runs after every link.
debug = "line-tables-only"
split-debuginfo = "unpacked"
# The engine is per-pixel scalar loops end to end (tile compositing, mip downsampling, blur,
# flood fill). At opt-level 0 those run an order of magnitude slower than shipped code, which
# makes every interactive measurement taken against a dev build meaningless. 3 matches
# release's auto-vec and unroll so `cargo test` / a plain `cargo build` are not a different
# engine; the extra codegen versus 2 is cheap next to linking.
opt-level = 3

[profile.dev.package."*"]
# Dependencies change rarely and are recompiled almost never, so there is no iteration cost to
# building them the same way release does — and `wgpu`, `png` and `rusqlite` are all on the
# hot path.
opt-level = 3

[profile.test]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
# One codegen unit lets LLVM inline across the whole crate, which is what the tile/pixel
# helpers need — they are small functions called from inside million-iteration loops.
codegen-units = 1
strip = "symbols"
# Deliberately NOT `panic = "abort"`: the FFI boundary catches unwinds (`with_inner`) so a
# Rust panic can never cross into Swift. Aborting would turn a recoverable engine error into
# an app crash.
