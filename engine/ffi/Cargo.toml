[package]
name = "calumma-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "calumma_ffi"
crate-type = ["rlib"]

[dependencies]
calumma-core = { path = "../core" }
calumma-io = { path = "../io" }
calumma-ops = { path = "../ops" }
calumma-render = { path = "../render" }
anyhow = { workspace = true }
parking_lot = { workspace = true }
num_enum = { workspace = true }
rayon = { workspace = true }
# Backends are per-target, same split as `calumma-render` — see the note there.
wgpu = { workspace = true, default-features = false, features = ["wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, default-features = false, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, default-features = false, features = ["vulkan"] }

[dev-dependencies]
tempfile = { workspace = true }
