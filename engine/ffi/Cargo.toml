[package]
name = "calumma-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "calumma_ffi"
crate-type = ["rlib"]

[dependencies]
calumma-core = { path = "../core" }
calumma-io = { path = "../io" }
calumma-render = { path = "../render" }
anyhow = { workspace = true }
parking_lot = { workspace = true }
num_enum = { workspace = true }
rayon = { workspace = true }
# Backends are per-target, same split as `calumma-render` — see the note there.
wgpu = { workspace = true, default-features = false, features = ["wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, default-features = false, features = ["metal"] }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSIndexSet",
    "NSString",
] }
objc2-core-graphics = { workspace = true, features = [
    "CGColorSpace",
    "CGDataProvider",
    "CGImage",
] }
objc2-core-video = { workspace = true, features = ["CVPixelBuffer"] }
objc2-vision = { workspace = true, features = [
    "VNGenerateForegroundInstanceMaskRequest",
    "VNObservation",
    "VNRequest",
    "VNRequestHandler",
    "objc2-core-graphics",
    "objc2-core-video",
] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, default-features = false, features = ["vulkan"] }

[dev-dependencies]
tempfile = { workspace = true }
