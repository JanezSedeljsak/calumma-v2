[package]
name = "calumma-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "calumma_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
calumma-core = { path = "../core" }
calumma-io = { path = "../io" }
calumma-ops = { path = "../ops" }
calumma-render = { path = "../render" }
bytemuck = { workspace = true, features = ["derive"] }
pollster = { workspace = true }
wgpu = { workspace = true, default-features = false, features = ["metal", "wgsl"] }
