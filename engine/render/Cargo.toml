[package]
name = "calumma-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
calumma-core = { path = "../core" }
bytemuck = { workspace = true, features = ["derive"] }
# Shader language only. The backend is per-target below: compiling every backend everywhere
# would drag Vulkan and DX12 into the macOS binary for nothing.
wgpu = { workspace = true, default-features = false, features = ["wgsl"] }
pollster = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }

# `default-features = false` has to be repeated on every one of these: Cargo unions the
# feature sets of all entries for the same crate, and a single entry that let defaults back in
# would re-enable all of wgpu's backends on all of them.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, default-features = false, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, default-features = false, features = ["vulkan"] }

[build-dependencies]
naga = { workspace = true, features = ["wgsl-in"] }
