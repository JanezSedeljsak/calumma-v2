repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending

  - repo: https://github.com/crate-ci/typos
    rev: v1.28.4
    hooks:
      # No --write-changes (the hook's own default): a spellchecker guessing fixes for short
      # identifiers is a real hazard here — it silently rewrote `iy` (a y-index) to `it`
      # while this config was being tested. Report-only; a human decides the fix.
      - id: typos
        args: []

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path engine/Cargo.toml --all
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --manifest-path engine/Cargo.toml --workspace --all-targets -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false

      - id: swift-format
        name: swift-format
        entry: swift-format format --configuration platform/macos/.swift-format -i -r platform/macos/Calumma
        language: system
        files: \.swift$
        pass_filenames: false

      - id: core-purity
        name: core has no platform deps
        entry: python3 ./manage.py purity
        language: system
        pass_filenames: false

      - id: app-icon
        name: regenerate AppIcon.appiconset from design/icon.png
        entry: python3 ./manage.py icon
        language: system
        files: ^design/icon\.png$
        pass_filenames: false

      - id: xcodegen-version
        name: regenerate Calumma.xcodeproj on a Cargo.toml version bump
        entry: python3 ./manage.py xcodegen
        language: system
        files: ^engine/Cargo\.toml$
        pass_filenames: false
