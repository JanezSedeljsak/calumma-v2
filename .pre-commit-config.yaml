repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending

  - repo: https://github.com/crate-ci/typos
    rev: v1.28.4
    hooks:
      # No --write-changes (the hook's own default): a spellchecker guessing fixes for short
      # identifiers is a real hazard here — it silently rewrote `iy` (a y-index) to `it`
      # while this config was being tested. Report-only; a human decides the fix.
      - id: typos
        args: []

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: python3 ./manage.py fmt --write
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: python3 ./manage.py clippy
        language: system
        files: \.rs$
        pass_filenames: false

      - id: core-purity
        name: core has no platform deps
        entry: python3 ./manage.py purity
        language: system
        pass_filenames: false
