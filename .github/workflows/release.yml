name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'version to stamp (default: engine workspace version)'
        type: string
        default: ''
      publish:
        description: 'also publish a GitHub prerelease'
        type: boolean
        default: false

env:
  CARGO_TARGET_DIR: engine/target

permissions:
  contents: write

jobs:
  macos-dmg:
    name: macos installable (.dmg)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install xcodegen
        run: command -v xcodegen || brew install xcodegen
      - name: test
        run: ./manage.py test
      - name: package
        id: package
        env:
          VERSION_INPUT: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$VERSION_INPUT"
          if [ -z "$version" ] && [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"
          fi
          if [ -n "$version" ]; then
            ./manage.py package --version "$version"
          else
            ./manage.py package
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: calumma-macos-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
      - name: publish release
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.package.outputs.version }}
          DMG: ${{ steps.package.outputs.dmg }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            prerelease=""
          else
            tag="v$VERSION"
            prerelease="--prerelease"
          fi
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "## Calumma $VERSION — macOS"
            echo
            echo "Download \`$(basename "$DMG")\`, open it, and drag **Calumma** into **Applications**."
            echo
            echo "This build is **ad-hoc signed, not notarized** — macOS Gatekeeper will refuse the"
            echo "first launch. Right-click the app → **Open** → **Open**, or run:"
            echo
            echo '```'
            echo "xattr -dr com.apple.quarantine /Applications/Calumma.app"
            echo '```'
            echo
            echo "Apple Silicon only. Requires macOS 26 or later."
            echo
            echo "Verify the download:"
            echo
            echo '```'
            echo "shasum -a 256 -c $(basename "$DMG").sha256"
            echo '```'
          } > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.dmg dist/*.sha256 --clobber
          else
            gh release create "$tag" dist/*.dmg dist/*.sha256 \
              --title "Calumma $VERSION" \
              --notes-file "$notes" \
              --target "$GITHUB_SHA" \
              $prerelease
          fi
