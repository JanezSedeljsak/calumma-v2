name: main

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

env:
  CARGO_TARGET_DIR: engine/target

jobs:
  core-linux:
    name: core (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: test core
        run: cargo test --manifest-path engine/Cargo.toml -p calumma-core --all-targets
      - name: clippy core
        run: cargo clippy --manifest-path engine/Cargo.toml -p calumma-core --all-targets -- -D warnings
      - name: coverage core
        run: ./manage.py coverage --package calumma-core

  core-windows:
    name: core (windows-latest)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: test core
        run: cargo test --manifest-path engine/Cargo.toml -p calumma-core --all-targets
      - name: clippy core
        run: cargo clippy --manifest-path engine/Cargo.toml -p calumma-core --all-targets -- -D warnings

  macos:
    name: macos workspace
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - name: install xcodegen
        run: command -v xcodegen || brew install xcodegen
      - name: fmt
        run: cargo fmt --manifest-path engine/Cargo.toml --all -- --check
      - name: clippy
        run: cargo clippy --manifest-path engine/Cargo.toml --workspace --all-targets -- -D warnings
      - name: test
        run: ./manage.py test
      - name: coverage
        run: ./manage.py coverage
      - name: build ffi
        run: cargo build --manifest-path engine/Cargo.toml -p calumma-ffi
      - name: core purity
        run: ./manage.py purity
      - name: test swift
        run: ./manage.py test-swift
