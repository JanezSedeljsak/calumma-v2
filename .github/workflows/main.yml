name: main

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'version to stamp (default: engine workspace version)'
        type: string
        default: ''
      publish:
        description: 'also publish a GitHub prerelease'
        type: boolean
        default: false

env:
  CARGO_TARGET_DIR: engine/target

permissions:
  contents: read

jobs:
  core-linux:
    name: core (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: test core
        run: cargo test --manifest-path engine/Cargo.toml -p calumma-core --all-targets
      - name: clippy core
        run: cargo clippy --manifest-path engine/Cargo.toml -p calumma-core --all-targets -- -D warnings
      - name: coverage core
        run: ./manage.py coverage --package calumma-core

  core-windows:
    name: core (windows-latest)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: test core
        run: cargo test --manifest-path engine/Cargo.toml -p calumma-core --all-targets
      - name: clippy core
        run: cargo clippy --manifest-path engine/Cargo.toml -p calumma-core --all-targets -- -D warnings

  macos:
    name: macos workspace
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - name: install xcodegen
        run: command -v xcodegen || brew install xcodegen
      - name: fmt
        run: cargo fmt --manifest-path engine/Cargo.toml --all -- --check
      - name: ruff
        run: |
          python -m ruff format --check manage.py cli
          python -m ruff check manage.py cli
      - name: clippy
        run: cargo clippy --manifest-path engine/Cargo.toml --workspace --all-targets -- -D warnings
      - name: test
        run: ./manage.py test
      - name: coverage
        run: ./manage.py coverage
      - name: build ffi
        run: cargo build --manifest-path engine/Cargo.toml -p calumma-ffi
      - name: core purity
        run: ./manage.py purity
      - name: test swift
        run: ./manage.py test-swift

  version-check:
    name: check for a workspace version bump
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: diff engine/Cargo.toml version against the previous commit
        id: check
        run: ./manage.py version-check

  macos-dmg:
    name: macos installable (.dmg)
    needs: [version-check]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref_type == 'tag' ||
       needs.version-check.outputs.changed == 'true')
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - name: install xcodegen
        run: command -v xcodegen || brew install xcodegen
      - name: test
        run: ./manage.py test
      - name: package
        id: package
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: ./manage.py ci-release package
      - uses: actions/upload-artifact@v4
        with:
          name: calumma-macos-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
      - name: publish release
        if: github.ref_type == 'tag' || inputs.publish || needs.version-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_RELEASE: ${{ needs.version-check.outputs.changed }}
          VERSION: ${{ steps.package.outputs.version }}
          DMG: ${{ steps.package.outputs.dmg }}
        run: ./manage.py ci-release publish
