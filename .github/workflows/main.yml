name: main

# Five stages, in order: lint, security, the full Linux pass (tests plus a release build of the
# shell), the same on Windows and macOS, then a GitHub release only when the workspace version
# actually moved (or on a `v*` tag, or a dispatch with `publish`). Each gate runs on the cheapest
# machine that can answer it, so a formatting slip, a vulnerable dependency, a failing test or a
# broken build is reported from ubuntu and never spends a Windows or macOS runner.
#
#   lint  ->  security  ->  test-linux / build-linux
#         ->  test-windows / build-windows / test-macos / build-macos  ->  release
#
# `pre-commit-autofix` deliberately sits outside that chain: it is the *fixer*, and gating it
# behind `lint` would deadlock — lint fails, the autofix that would have healed it never runs.

on:
  push:
    paths-ignore:
      - '**.md'
      - 'portal/**'
      - '.github/workflows/portal.yml'
      - '**/.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'portal/**'
      - '.github/workflows/portal.yml'
      - '**/.gitignore'
  workflow_dispatch:
    inputs:
      version:
        description: 'version to stamp (default: engine workspace version)'
        type: string
        default: ''
      publish:
        description: 'also publish a GitHub prerelease'
        type: boolean
        default: false

env:
  CARGO_TARGET_DIR: engine/target

permissions:
  contents: read

jobs:
  pre-commit-autofix:
    name: pre-commit autofix
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "engine -> target"
      - name: pre-commit (fixers only, autofixes committed below)
        run: pre-commit run --all-files || true
      # `.pre-commit-config.yaml` is the single source of truth for what gets fixed here — add
      # a hook there and this job picks it up with no workflow change. Fork PRs can't be pushed
      # to with the default token, so autofix is a no-op there; `main`'s own fmt/lint checks
      # still catch it, they just won't self-heal.
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: pre-commit auto-fixes"

  # Stage 1. Everything that can be decided without running the product, on the cheapest runner
  # there is. Nothing downstream starts until this passes.
  lint:
    name: lint (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "engine -> target"
      - name: native codec build deps
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake ninja-build nasm
      - name: lint
        run: ./manage.py lint

  # Stage 2. Three scanners, layered on purpose rather than by accident — see the Trivy step
  # for what each one covers that the others do not.
  security:
    name: security (ubuntu-latest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Audits the committed lockfile rather than a freshly resolved tree, so what is checked is
      # what actually ships. Fails on a vulnerability; unmaintained and yanked crates are
      # reported as warnings and do not block — add `--deny warnings` to make them block too.
      # A single advisory with no upgrade path is silenced with `--ignore RUSTSEC-0000-0000`.
      - name: cargo audit
        run: cargo audit --file engine/Cargo.lock
      - run: python -m pip install pip-audit
      # `--requirement`, not an audit of the installed environment. Auditing the environment
      # sounds stricter and is worse: it reports advisories against the runner's own `pip` and
      # `setuptools`, which are the tools running the audit rather than anything Miw
      # depends on — so the gate would fail on day one, and then flake with whatever pip the
      # runner image happens to ship. `--requirement` still resolves transitively (12 packages
      # from the three pinned lines), so nothing real is skipped.
      - name: pip-audit
        run: python -m pip_audit --requirement requirements.txt
      # Trivy is not a third opinion on the same two lockfiles — it reaches things the other two
      # cannot:
      #
      #   * `portal/bun.lock`. The portal is a Vite/TypeScript site and its npm tree was
      #     unaudited by anything until now; `cargo audit` and `pip-audit` do not see it, and
      #     `portal.yml` has no security step of its own. Trivy parses the lockfile natively.
      #   * **Secrets.** A committed token is the one finding neither advisory scanner looks for.
      #   * A second vulnerability database. `cargo audit` reads RustSec and `pip-audit` reads
      #     PyPI/OSV; Trivy reads the GitHub Advisory DB, so the overlap on `Cargo.lock` and
      #     `requirements.txt` is cheap and occasionally catches what the other source has not
      #     published yet.
      #
      # `exit-code: 1` is load-bearing and easy to leave off: Trivy's default is to *report*
      # findings and exit 0, so without it this step is decorative — verified against a planted
      # credential, which is reported as CRITICAL and still exits 0 unless this is set.
      #
      # `misconfig` is deliberately not among the scanners. It has nothing to read here — no
      # Dockerfile, no Terraform, no Kubernetes — and Trivy does not lint GitHub Actions
      # workflows, so it reports "0 config files" and buys a slower job. `zizmor` or
      # `actionlint` is the tool for that, if it is ever wanted.
      - name: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          # HIGH and CRITICAL only, so the gate stays something worth stopping a merge for.
          # Trivy's secret rules land in these two anyway, so this is really a vulnerability
          # threshold — drop it to catch MEDIUM once the noise is known to be manageable.
          severity: HIGH,CRITICAL
          exit-code: 1
          # None of these exist on a fresh CI checkout; they are here so the same command is
          # runnable locally, where a built `engine/target` alone is minutes of scanning.
          skip-dirs: engine/target,.venv,portal/node_modules

  # Stage 3. Everything on Linux first — engine tests and a release build of the shell, side by
  # side. The build is the only thing that links `gui/` and the native codec crates (libaom,
  # heif-rs) here, so a compile break surfaces on ubuntu before Windows or macOS is spent on it.
  test-linux:
    name: test (ubuntu-latest)
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "engine -> target"
      - name: software vulkan (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: test core
        run: cargo test --manifest-path engine/Cargo.toml -p calumma-core --all-targets
      - name: test render
        env:
          WGPU_BACKEND: vulkan
        run: cargo test --manifest-path engine/Cargo.toml -p calumma-render --all-targets
      - name: coverage core
        run: ./manage.py coverage --package calumma-core

  build-linux:
    name: build (ubuntu-latest)
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
            gui -> target
      # libclang for heif-rs's bindgen, cmake/ninja/nasm for libaom, and the rest for Slint's
      # winit backend (fontconfig, xkbcommon, wayland, udev).
      - name: native build deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libclang-dev cmake ninja-build nasm \
            libfontconfig1-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxext-dev libxfixes-dev
      - name: package
        id: package
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: ./manage.py ci-release package
      - uses: actions/upload-artifact@v4
        with:
          name: miw-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256

  # Stage 4. Windows and macOS, only once Linux is fully green. Each OS packages its installer
  # into dist/; stage 5 publishes every artifact when the version actually moved.
  test-windows:
    name: test (windows-latest)
    needs: [test-linux, build-linux]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "engine -> target"
      - name: test core
        run: cargo test --manifest-path engine/Cargo.toml -p calumma-core --all-targets

  test-macos:
    name: test (macos-26)
    needs: [test-linux, build-linux]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "engine -> target"
      - name: cmake for libaom
        run: command -v cmake || brew install cmake
      - name: clippy darwin crates
        run: ./manage.py clippy --darwin-only
      - name: test
        run: ./manage.py test
      - name: coverage
        run: ./manage.py coverage
      - name: build ffi
        run: cargo build --manifest-path engine/Cargo.toml -p calumma-ffi

  build-windows:
    name: build (windows-latest, .msi)
    needs: [test-linux, build-linux]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
            gui -> target
      # cmake and LLVM (for bindgen) ship on the image; nasm, which libaom's x86 asm needs, does not.
      - uses: ilammy/setup-nasm@v1
      - name: package
        id: package
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: python ./manage.py ci-release package
      - uses: actions/upload-artifact@v4
        with:
          name: miw-windows-x86_64
          path: |
            dist/*.msi
            dist/*.sha256

  build-macos:
    name: build (macos-26, .dmg)
    needs: [test-linux, build-linux]
    runs-on: macos-26
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
            gui -> target
      - name: cmake for libaom
        run: command -v cmake || brew install cmake
      - name: package
        id: package
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: ./manage.py ci-release package
      - uses: actions/upload-artifact@v4
        with:
          name: miw-macos-dmg
          path: |
            dist/*.dmg
            dist/*.sha256

  version-check:
    name: check for a workspace version bump
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: diff engine/Cargo.toml version against the previous commit
        id: check
        run: ./manage.py version-check

  # Stage 5. Publishing is just `gh` against artifacts that already exist, so it runs on
  # ubuntu rather than holding a macOS runner. `always()` is only there because `version-check`
  # is skipped off `main`; every platform job still has to have actually succeeded.
  release:
    name: release
    needs: [version-check, test-linux, build-linux, test-windows, build-windows, test-macos, build-macos]
    if: |
      always() &&
      (github.ref_type == 'tag' ||
       inputs.publish ||
       needs.version-check.outputs.changed == 'true') &&
      needs.test-linux.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.test-windows.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.test-macos.result == 'success' &&
      needs.build-macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: miw-*
          path: dist
          merge-multiple: true
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_RELEASE: ${{ needs.version-check.outputs.changed }}
          VERSION: ${{ needs.build-macos.outputs.version }}
        run: ./manage.py ci-release publish
