[package]
name = "miw"
version = "0.31.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "Miw"
path = "src/main.rs"

[dependencies]
calumma-app = { path = "../engine/app" }
calumma-core = { path = "../engine/core" }
anyhow = "1.0"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rfd = "0.15"
image = "0.25"
calumma-io = { path = "../engine/io" }
slint = { version = "1.17", default-features = false, features = [
    "backend-winit",
    "renderer-femtovg",
    "unstable-winit-030",
    "compat-1-2",
] }
i-slint-backend-winit = "=1.17.1"
i-slint-backend-testing = { version = "=1.17.1", optional = true, features = [
    "mcp",
] }
raw-window-handle = "0.6"

[features]
mcp-devtools = ["dep:i-slint-backend-testing"]

[dependencies.winit]
version = "0.30"
default-features = false
features = ["rwh_06"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSGraphics", "objc2-quartz-core", "objc2-core-graphics", "NSApplication", "NSImage", "NSSound", "NSWindow", "NSView", "NSResponder", "NSAppearance", "NSBezierPath"] }
objc2-quartz-core = { version = "0.3", features = ["CAMetalLayer", "CALayer", "CAShapeLayer", "objc2-metal", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGPath", "CGColor"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSProcessInfo"] }
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"

[build-dependencies]
slint-build = "1.17"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
